
name: Build Astra TV

on:
  workflow_dispatch:
  push:
    paths:
      - 'AstraTV-source-with-wallpaper.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip AstraTV-source-with-wallpaper.zip -d project

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Astra-TV-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
