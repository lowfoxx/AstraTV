
name: Build Astra TV

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project
        run: |
          ARCHIVE=$(find . -type f -iname '*.zip' | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: ZIP archive not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found: $ARCHIVE"
          mkdir project
          unzip "$ARCHIVE" -d project

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Astra-TV-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
